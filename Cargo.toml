[package]
name = "mlx-embeddings-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "Native Apple Silicon Rust engine for high-performance text and image embeddings using MLX"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/mlx-embeddings-rs"
homepage = "http://code.brandonhubbard.com/mlx-embeddings-rs/"

[[bin]]
name = "mlx-embeddings"
path = "src/bin/main.rs"

[lib]
name = "mlx_embeddings_rs"
path = "src/lib.rs"

[dependencies]
mlx-rs = "0.32.0"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
safetensors = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.12"
